<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" role="img" aria-label="LinkedIn" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .trail { stroke-dasharray: 110 890; animation: travel 12s linear infinite; animation-delay: 0s; }
    .halo  { animation: breathe 6s ease-in-out infinite; animation-delay: 0.0s; }
    @keyframes travel  { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @keyframes breathe { 0%,100% { opacity: .10; } 50% { opacity: .28; } }
    @media (prefers-reduced-motion: reduce) { .trail, .halo { animation: none; } }
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="trailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8BE9FD" stop-opacity="0"/>
      <stop offset="1" stop-color="#8BE9FD"/>
    </linearGradient>
    <radialGradient id="haloGrad">
      <stop offset="0" stop-color="#8BE9FD"/>
      <stop offset="1" stop-color="#8BE9FD" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="398" height="118" rx="20" fill="#282A36" stroke="#44475A" stroke-width="1.5"/>
  <rect class="trail" x="1" y="1" width="398" height="118" rx="20" fill="none" stroke="#8BE9FD" stroke-width="2" stroke-linecap="round" pathLength="1000"/>
  <circle class="halo" cx="60" cy="60" r="46" fill="url(#haloGrad)"/>
  <rect x="28" y="28" width="64" height="64" rx="16" fill="#8BE9FD" fill-opacity=".12" stroke="#8BE9FD" stroke-opacity=".35"/>
  <g transform="translate(45 45) scale(0.234)"><path fill="#8BE9FD" d="M116 3H12a8.91 8.91 0 00-9 8.8v104.42a8.91 8.91 0 009 8.78h104a8.93 8.93 0 009-8.81V11.77A8.93 8.93 0 00116 3zM39.17 107H21.06V48.73h18.11zm-9-66.21a10.5 10.5 0 1110.49-10.5 10.5 10.5 0 01-10.54 10.48zM107 107H88.89V78.65c0-6.75-.12-15.44-9.41-15.44s-10.87 7.36-10.87 15V107H50.53V48.73h17.36v8h.24c2.42-4.58 8.32-9.41 17.13-9.41C103.6 47.28 107 59.35 107 75z"/></g>
