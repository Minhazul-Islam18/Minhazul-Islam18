<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" role="img" aria-label="Mail" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .trail { stroke-dasharray: 110 890; animation: travel 12s linear infinite; animation-delay: -3s; }
    .halo  { animation: breathe 6s ease-in-out infinite; animation-delay: -1.5s; }
    @keyframes travel  { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @keyframes breathe { 0%,100% { opacity: .10; } 50% { opacity: .28; } }
    @media (prefers-reduced-motion: reduce) { .trail, .halo { animation: none; } }
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="trailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF79C6" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF79C6"/>
    </linearGradient>
    <radialGradient id="haloGrad">
      <stop offset="0" stop-color="#FF79C6"/>
      <stop offset="1" stop-color="#FF79C6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="398" height="118" rx="20" fill="#282A36" stroke="#44475A" stroke-width="1.5"/>
  <rect class="trail" x="1" y="1" width="398" height="118" rx="20" fill="none" stroke="#FF79C6" stroke-width="2" stroke-linecap="round" pathLength="1000"/>
  <circle class="halo" cx="60" cy="60" r="46" fill="url(#haloGrad)"/>
  <rect x="28" y="28" width="64" height="64" rx="16" fill="#FF79C6" fill-opacity=".12" stroke="#FF79C6" stroke-opacity=".35"/>
  <g transform="translate(45 45) scale(1.25)" fill="none" stroke="#FF79C6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4.5" width="20" height="15" rx="3"/><path d="M3 6.5l9 6.5 9-6.5"/></g>
  <text x="116" y="56" font-size="23" font-weight="600" fill="#F8F8F2">Mail</text>
  <text x="116" y="82" font-size="14.5" fill="#A4ABCB">Best for project inquiries</text>
</svg>
