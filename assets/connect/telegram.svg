<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" role="img" aria-label="Telegram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .trail { stroke-dasharray: 110 890; animation: travel 12s linear infinite; animation-delay: -9s; }
    .halo  { animation: breathe 6s ease-in-out infinite; animation-delay: -4.5s; }
    @keyframes travel  { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @keyframes breathe { 0%,100% { opacity: .10; } 50% { opacity: .28; } }
    @media (prefers-reduced-motion: reduce) { .trail, .halo { animation: none; } }
    @font-face { font-family: 'Jakarta600'; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Jakarta400'; src: url(data:font/woff2;base64,) format('woff2'); }
    .lab { font-family: 'Jakarta600', "Segoe UI", Helvetica, Arial, sans-serif; }
    .cap { font-family: 'Jakarta400', "Segoe UI", Helvetica, Arial, sans-serif; word-spacing: 1.5px; }
  </style>
  <defs>
    <linearGradient id="trailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BD93F9" stop-opacity="0"/>
      <stop offset="1" stop-color="#BD93F9"/>
    </linearGradient>
    <radialGradient id="haloGrad">
      <stop offset="0" stop-color="#BD93F9"/>
      <stop offset="1" stop-color="#BD93F9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="398" height="118" rx="20" fill="#282A36" stroke="#44475A" stroke-width="1.5"/>
  <rect class="trail" x="1" y="1" width="398" height="118" rx="20" fill="none" stroke="#BD93F9" stroke-width="2" stroke-linecap="round" pathLength="1000"/>
  <circle class="halo" cx="60" cy="60" r="46" fill="url(#haloGrad)"/>
  <rect x="28" y="28" width="64" height="64" rx="16" fill="#BD93F9" fill-opacity=".12" stroke="#BD93F9" stroke-opacity=".35"/>
  <g transform="translate(45 45) scale(1.25)"><path fill="#BD93F9" d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></g>
  <text x="116" y="56" class="lab" font-size="23" fill="#F8F8F2">Telegram</text>
  <text x="116" y="82" class="cap" font-size="14.5" fill="#A4ABCB">Message me anytime</text>
