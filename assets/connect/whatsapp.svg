<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" role="img" aria-label="WhatsApp" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .trail { stroke-dasharray: 110 890; animation: travel 12s linear infinite; animation-delay: -6s; }
    .halo  { animation: breathe 6s ease-in-out infinite; animation-delay: -3.0s; }
    @keyframes travel  { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @keyframes breathe { 0%,100% { opacity: .10; } 50% { opacity: .28; } }
    @media (prefers-reduced-motion: reduce) { .trail, .halo { animation: none; } }
    @font-face { font-family: 'Jakarta600'; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Jakarta400'; src: url(data:font/woff2;base64,) format('woff2'); }
    .lab { font-family: 'Jakarta600', "Segoe UI", Helvetica, Arial, sans-serif; }
    .cap { font-family: 'Jakarta400', "Segoe UI", Helvetica, Arial, sans-serif; word-spacing: 1.5px; }
  </style>
  <defs>
    <linearGradient id="trailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50FA7B" stop-opacity="0"/>
      <stop offset="1" stop-color="#50FA7B"/>
    </linearGradient>
    <radialGradient id="haloGrad">
      <stop offset="0" stop-color="#50FA7B"/>
      <stop offset="1" stop-color="#50FA7B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="398" height="118" rx="20" fill="#282A36" stroke="#44475A" stroke-width="1.5"/>
  <rect class="trail" x="1" y="1" width="398" height="118" rx="20" fill="none" stroke="#50FA7B" stroke-width="2" stroke-linecap="round" pathLength="1000"/>
  <circle class="halo" cx="60" cy="60" r="46" fill="url(#haloGrad)"/>
  <rect x="28" y="28" width="64" height="64" rx="16" fill="#50FA7B" fill-opacity=".12" stroke="#50FA7B" stroke-opacity=".35"/>
